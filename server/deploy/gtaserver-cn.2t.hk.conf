# Install inside an existing nginx http {} configuration, such as conf.d/.
# Certificates are installed separately and must never be committed.
server {
    # stream routes TLS on the existing public game ports to this listener.
    listen 127.0.0.1:5443 ssl;
    server_name gtaserver-cn.2t.hk;

    ssl_certificate /etc/ssl/gtaserver/fullchain.pem;
    ssl_certificate_key /etc/ssl/gtaserver/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GTAV_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_buffering off;

    # Java supplies Access-Control-Allow-Origin: *. Do not duplicate it here.
    location = /47485/health {
        proxy_pass http://127.0.0.1:17485/health;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /47486/health {
        proxy_pass http://127.0.0.1:17486/health;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /47485/ws {
        proxy_pass http://127.0.0.1:17485/ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    location = /47486/ws {
        proxy_pass http://127.0.0.1:17486/ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # A normal visit opens the public status page instead of the game API.
    location / {
        add_header Cache-Control "no-store" always;
        return 302 https://gtav.2t.hk/;
    }
}
