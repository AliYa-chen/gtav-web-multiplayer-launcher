# Include at nginx.conf top level, outside http {}.
# Requires the Nginx stream module with ssl_preread support.
stream {
    # Plain HTTP/WebSocket retains the original Java protocol. TLS is terminated
    # by the shared loopback HTTPS listener in gtaserver.2t.hk.conf.
    map $ssl_preread_protocol $gtav_primary_upstream {
        ""      127.0.0.1:17485;
        default 127.0.0.1:5443;
    }

    map $ssl_preread_protocol $gtav_experimental_upstream {
        ""      127.0.0.1:17486;
        default 127.0.0.1:5443;
    }

    server {
        listen 0.0.0.0:47485;
        ssl_preread on;
        proxy_pass $gtav_primary_upstream;
        proxy_connect_timeout 3s;
        proxy_timeout 90s;
    }

    server {
        listen 0.0.0.0:47486;
        ssl_preread on;
        proxy_pass $gtav_experimental_upstream;
        proxy_connect_timeout 3s;
        proxy_timeout 90s;
    }
}
