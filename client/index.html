<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA V 离线版</title>
<link rel="stylesheet" href="/multiplayer/join-modal.css">
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px Consolas, "Microsoft YaHei", "PingFang SC", monospace; overflow: hidden; }
	#canvas { display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: #000; }
	/* 标题画面：游戏加载画面（LOADINGSCREEN_STARTUP）使用 1280x720 舞台，并缩放到窗口大小；详见下方脚本。 */
	@font-face { font-family: 'Chalet'; src: url('/b/8b0b5899ed/title/chalet.woff') format('woff'); }
	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; transition: opacity .8s; z-index: 5; }
	#loading.done { opacity: 0; pointer-events: none; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; font: 12px Chalet, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; }
	.ls-screen { position: absolute; inset: 0; }
	/* 每层使用独立相机，使图层像 Scaleform 一样按显示列表顺序合成（不进行深度测试）：640 / tan(55 deg / 2) = 1229。
	   Scaleform 的默认 3D 相机位于舞台中心，并随画面滑动反向移动；详见下方脚本。 */
	.ls-cam { position: absolute; inset: 0; perspective: 1229px; perspective-origin: 640px 360px; }
	.ls-layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-size: 100% 100%; }
	#ls-logo { position: absolute; left: 95px; top: 492.5px; width: 186px; height: 186px; }
	#ls-bars { position: absolute; right: 96px; top: 642px; max-width: 1088px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; }
	.ls-bar { min-height: 24px; padding: 0 6px; display: flex; align-items: center; background: rgba(0, 0, 0, .706); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0; border: 0; background: none; color: #fff; font: 12px Chalet, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; cursor: pointer; }
	#modes button:disabled { cursor: default; }
	#modes button[hidden] { display: none; }
	#modes.ask button:not(:disabled) .ls-key { animation: ls-ask 1.2s ease-in-out infinite; }
	@keyframes ls-ask { 50% { opacity: .35; } }
	.ls-key { margin-left: 4px; min-width: 12px; height: 15px; padding: 0 4px; line-height: 16px; border-radius: 2px; background: #fff; color: #000; font-size: 10px; text-transform: uppercase; }
	.ls-spin { flex: none; width: 22px; height: 22px; margin-left: 2px; background: url('/b/8b0b5899ed/title/spinner.png') center / 24px 24px no-repeat; animation: ls-spin 2s steps(60) infinite; }
	@keyframes ls-spin { from { transform: rotate(0deg) scaleX(-1); } to { transform: rotate(-360deg) scaleX(-1); } }
	#label { max-width: 660px; white-space: normal; overflow-wrap: anywhere; text-shadow: .85px .85px 1px rgba(0, 0, 0, .45); }
	#pct { margin-left: 15px; font-variant-numeric: tabular-nums; }
	/* 暂时保留移植版的底部进度条；上方居中显示最新日志，再上方显示已下载的数据量。 */
	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: center; font: 10px/1.35 Consolas, "Microsoft YaHei", "PingFang SC", monospace; color: rgba(190, 190, 190, .75); text-shadow: 0 0 2px #000, 1px 1px 1px #000; white-space: pre; pointer-events: none; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
	#fill { height: 100%; width: 0; background: #7cc576; }
	#hud { position: fixed; left: 8px; bottom: 8px; max-width: 60vw; white-space: pre-wrap; opacity: .8; pointer-events: none; }
	#fps { position: fixed; left: 8px; top: 6px; display: none; color: #0f0; font: bold 18px/1.2 Consolas, "Microsoft YaHei", "PingFang SC", monospace; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 2px #000, 0 0 3px #000; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>
<div id="hud"></div>
<div id="loading"><div id="ls-stage"><div id="ls-screens"></div><img id="ls-logo" src="/b/8b0b5899ed/title/logo.png" alt=""><div id="ls-bars"><div id="modes" class="ls-bar"><button data-act="back"></button><button data-act="map5"></button><button data-act="map6"></button><button data-act="sandbox"></button><button data-act="story"></button><button data-act="online"></button></div><div class="ls-bar"><span id="label">正在启动…</span><span id="pct">0%</span><i class="ls-spin"></i></div></div></div><div id="ls-log"><div id="data"></div><div id="console"></div></div><div id="bar"><div id="fill"></div></div></div>
<div id="fps"></div>
<script type="module">
import { installGameAdapter } from '/multiplayer/game-adapter.js';
import { installJoinModal, readPublicPreferences, consumePublicEntryIntent } from '/multiplayer/join-modal.js';
import { startPublicSession } from '/multiplayer/public-session.js';
// 浏览器版本的入口页。引擎在专用工作线程中运行（loader.js，相当于引擎的“主线程”，静态构造函数和
// main() 在此执行，可能阻塞该线程）。页面仅持有 canvas，并将其交给该线程，再转交 GPU 工作线程。
// 查询参数：?args=-flag1,-flag2=value 将参数追加到引擎命令行；?shot=N 将每第 N 次画面呈现的截图发送到开发服务器。
// 多人游戏入口只运行 GTA V 沙盒，忽略地址栏中的模式和诊断参数。
const ROOM_GAME = location.pathname === '/play/';
const q = new URLSearchParams(ROOM_GAME ? 'mode=sandbox' : location.search);
const onlinePreferences = ROOM_GAME ? readPublicPreferences() : null;
const ONLINE_RECONNECT = ROOM_GAME && consumePublicEntryIntent(performance.getEntriesByType('navigation')[0]?.type);
const ONLINE_LOADING = ONLINE_RECONNECT ? '恢复战局中' : '加入战局中';
// 浏览器从页面快照恢复时，旧连接和工作线程已在 pagehide 关闭，需要重新初始化。
if (ROOM_GAME) addEventListener('pageshow', (event) => { if (event.persisted) location.reload(); });
let onlineConnectionReady = !ROOM_GAME;
const joinModal = installJoinModal({ onJoin: () => location.assign('/play/') });
const editingInput = (event) => joinModal.isOpen || Boolean(event.target?.closest?.('input,textarea,select,[contenteditable="true"]'));
// 在线入口在页面捕获阶段拦截调试按键，避免将它们写入引擎的共享输入区。
function stopOnlineDebugKey(e) {
	if (editingInput(e)) return false;
	if (!ROOM_GAME || !((e.code === 'KeyP' && e.shiftKey) || ['Equal', 'NumpadAdd', 'Insert', 'Delete'].includes(e.code) || /^F(?:[1-9]|1[0-2])$/.test(e.code))) return false;
	e.preventDefault(); e.stopImmediatePropagation();
	return true;
}
for (const type of ['keydown', 'keyup']) addEventListener(type, stopOnlineDebugKey, { capture: true });
// 页面所加载内容（加载器、工作线程、引擎、着色器、标题素材）的 URL 前缀：开发服务器上为空；PHP 主机（phase3/host/index.php）会将页面中的
// `/b/8b0b5899ed` 通过 str_replace 替换为 `/b/<build id>`，从而长期缓存这些文件，并在构建变化时更换 URL。
const BASE = '/b/8b0b5899ed'.charAt(0) === '_' ? '' : '/b/8b0b5899ed';
// 仅翻译页面显示的内容；工作线程消息和上传日志仍保持原始格式，便于排查问题。
const PROGRESS_TEXT = Object.freeze({
	'Compiling the engine': '正在编译游戏引擎',
	'Starting the engine': '正在启动游戏引擎',
	'Mounting archives': '正在挂载资源包',
	'Reading settings': '正在读取设置',
	'Starting graphics': '正在初始化图形',
	'Loading shaders': '正在加载着色器',
	'Loading text': '正在加载文字资源',
	'Starting audio': '正在启动音频',
	'Loading audio metadata': '正在加载音频信息',
	'Starting scripts': '正在启动游戏脚本',
	'Loading the world': '正在加载游戏世界',
	'First frame': '正在生成第一帧',
	'Preparing shaders': '正在准备着色器',
	'Ready': '加载完成',
	'Press Ok to abort the program.  It is not safe to continue.': '请点击“确定”终止程序，当前无法安全继续运行。',
});
function translateUiText(value) {
	const text = String(value ?? '');
	if (PROGRESS_TEXT[text]) return PROGRESS_TEXT[text];
	return text
		.replace(/^Downloading and compiling the engine \((.*)\)$/, '正在下载并编译游戏引擎（$1）')
		.replace(/^Downloading the engine \((.*)\)$/, '正在下载游戏引擎（$1）')
		.replace(/^The server is busy, retrying \((\d+)\)$/, '服务器繁忙，正在重试（第 $1 次）')
		.replace(/^engine download failed: /, '游戏引擎下载失败：')
		.replace(/^Scaleform font preload failed: /, 'Scaleform 字体预加载失败：')
		.replace(/^worker error: /, '工作线程出错：')
		.replace(/THREAD REJECTION \(([^)]+)\): /, '线程异常（$1）：')
		.replace(/RuntimeError: memory access out of bounds/g, '运行时错误：内存访问越界')
		.replace(/RuntimeError: unreachable/g, '运行时错误：执行到不可达指令')
		.replace(/^\[wasm\] hang report (\d+): no engine log line for (\d+) s; blocked threads:/, '[wasm] 卡顿报告 $1：引擎已 $2 秒未输出日志；阻塞线程：');
}
// ?log=1：页面、引擎线程及工作线程将日志发送到开发服务器（browser.log、browser_<ip>.log）；默认关闭，以节省玩家的上传
// 带宽和本线程的处理时间。加载画面上的日志和浏览器控制台不受此选项影响。
const remoteLog = q.get('log') === '1';
const postLog = (text) => { if (remoteLog) fetch('/log', { method: 'POST', body: text }).catch(() => {}); };
// 引擎线程的崩溃报告（prejs.js 的 __crash、loader.js 的 onAbort/onExit）显示在左下角；疑似内存问题时附带提示。报告仅在启用
// ?log=1 时上传到主机日志（每页最多 3 条，每条约 10 KB；2026-10-06 前总会上传，当时每日 10,000 名访客产生 5,500 次请求，并为每位访客创建日志文件）。正常退出不报告。
{
	let posted = 0;
	new BroadcastChannel('game-crash').onmessage = (ev) => {
		const m = ev.data;
		const memory = /memory|OOM|Aborted\(|RangeError|grow/i.test(m.text);
		const dev = ' deviceMemory ' + (navigator.deviceMemory || '?') + ' GB, cores ' + navigator.hardwareConcurrency;
		if (remoteLog && posted++ < 3) fetch('/log', { method: 'POST', body: '[page] CRASH (' + m.kind + ', ' + m.thread + ' thread, wasm heap ' + m.heap + ' MB,' + dev + ', ' + location.search + '): ' + m.text + '\n' + m.tail.join('\n') + '\n' }).catch(() => {});
		const el = document.getElementById('hud');
		if (el) { el.textContent = '游戏已停止（' + ({ error: '错误', rejection: '未处理的异常', abort: '中止', exit: '退出' }[m.kind] || m.kind) + '）：' + translateUiText(m.text.split('\n')[0].slice(0, 200)) + (memory ? '。可能与内存不足有关，请关闭其他标签页后刷新。' : '。请刷新页面。'); el.style.color = '#f96'; }
	};
}
// ---- 标题画面：使用 HTML 重现游戏自身的 LOADINGSCREEN_STARTUP 加载画面（scaleform_frontend.rpf） ----------------------------------------
// 移植自游戏加载时播放的 ActionScript（com.rockstargames.gtav.loadingScreens.LOADINGSCREEN_STARTUP，使用 JPEXS FFDec 反编译）。
// 其加载上下文为 CTX_GAMELOAD。1280x720 舞台缩放到窗口，16:9 区域之外显示黑色；内置海滩画面和 17 个 loadingscreen<N> 素材画面，按动画中的
// 六种随机顺序之一播放。每个画面包含在 3D 空间倾斜的背景面板和前景裁片（Scaleform 相机以舞台中心为基准，视角为 55 度，旋转中心位于
// 图层左上角；Scaleform 的 +Z 方向远离观众，CSS 则指向观众，因此角度取反）。每隔 14 秒切换画面，下一画面
// 从交替的两侧滑入，旧画面滑出（持续 0.85 秒，使用三次缓入缓出）；各图层在 42 秒内线性过渡到终值。GTA V 标志
// 位于左下角，操作提示按钮栏位于右下角，两者遵循启动时的安全边距（7.5%，CHudTools::GetFakeLoadingScreenSafeZone）。
// 素材、标志、旋转图标和字体（$Font2 = Chalet London 1960）均来自游戏（由 phase3/make_title.py 生成，通过 /b/8b0b5899ed/title/ 提供）。
let stopTitle = () => {};
{
	const stage = document.getElementById('ls-stage'), holder = document.getElementById('ls-screens');
	const fit = () => {
		const s = Math.min(innerWidth / 1280, innerHeight / 720);
		stage.style.transform = 'translate(' + (innerWidth - 1280 * s) / 2 + 'px,' + (innerHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
	};
	fit();
	addEventListener('resize', fit);
	const L = (tex, w, h, x, y, yr, to) => ({ tex, w, h, x, y, yr, to });
	const BG = (n, yr, to, x = 98) => L('ls' + n + '_background', 1024, 512, x, 95, yr, to);
	const FG = (n, name, w, h, x, y, toX, yr = 0) => L('ls' + n + '_' + name, w, h, x, y, yr, { x: toX });
	const SCREENS = [		// 动画的 loadingScreens 数组：按从下到上的顺序，记录每个图层的初始设置（尺寸、位置、_yrotation）和 tweenTo 目标。
		[L('beach_bg', 1024, 512, 98, 95, 20, { yr: -6, xr: 5 }), L('beach_fg', 343, 629, 480, 95, 0, { x: 720 })],
		null,		// loadingscreen_builtin1（Frisk）：此构建的动画不包含其元件，也没有任何播放顺序使用它。
		[BG(0, 7, { yr: -7 }), FG(0, 'foreground', 299, 599, 360, 140, 560, 7)],
		[BG(1, 6, { yr: -12 }), FG(1, 'foreground', 503, 206, 300, 465, 480), FG(1, 'foreground_franklin', 368, 588, 440, 140, 745)],
		[BG(2, 7, { yr: -5, xr: 5 }), FG(2, 'foreground', 311, 558, 745, 200, 450), FG(2, 'foreground_chop', 320, 512, 640, 260, 310)],
		[BG(3, 12, { yr: -4 }, 110), FG(3, 'foreground', 412, 609, 440, 120, 730)],		// 其 foreground_car 为“isInFla”图层，但动画中缺少该图层，因此游戏不显示汽车。
		[BG(4, 7, { yr: -4, xr: 5 }), FG(4, 'foreground', 251, 643, 400, 85, 250)],
		[BG(5, 7, { yr: -6 }), FG(5, 'foreground', 389, 640, 450, 95, 700)],
		[BG(6, 7, { yr: 0, xr: 5 }), FG(6, 'foreground', 367, 603, 410, 115, 800)],
		[BG(7, 6, { yr: -6, xr: 5 }), FG(7, 'foreground', 311, 625, 860, 95, 520)],
		[BG(8, 7, { yr: -5, xr: 5 }), FG(8, 'foreground', 492, 497, 400, 190, 660)],
		[BG(9, 7, { yr: -3, xr: 5 }), FG(9, 'foreground', 331, 675, 220, 50, 140)],
		[BG(10, 6, { yr: -5, xr: 5 }), FG(10, 'foreground', 352, 682, 545, 65, 485)],
		[BG(11, 7, { yr: -3, xr: 5 }), FG(11, 'foreground', 344, 669, 309, 51, 424)],
		[BG(12, 6, { yr: -4 }), FG(12, 'foreground_michael', 462, 677, 345, 42, 220)],
		[BG(13, 5, { yr: -6, xr: 5 }), FG(13, 'foreground', 399, 681, 430, 39, 250)],
		[BG(14, 6, { yr: -2, xr: 5 }), FG(14, 'foreground', 392, 631, 650, 95, 850)],
		[BG(15, 6, { yr: -3, xr: 5 }), FG(15, 'foreground', 385, 642, 404, 78, 261)],
		[BG(16, 6, { yr: -3, xr: 5 }), FG(16, 'foreground', 300, 600, 300, 150, 400)],
	];
	const ORDERS = [[0, 16, 18, 3, 12, 2, 17, 10, 9, 8, 15, 6, 11, 14, 4, 7, 13], [0, 4, 6, 17, 11, 16, 18, 7, 9, 15, 3, 14, 10, 13, 2, 8, 12],
		[0, 7, 16, 14, 13, 3, 10, 2, 15, 18, 8, 9, 4, 17, 12, 6, 11], [0, 8, 18, 9, 13, 4, 11, 14, 7, 17, 6, 12, 3, 16, 2, 15, 10],
		[0, 11, 12, 7, 18, 14, 9, 13, 4, 2, 15, 11, 8, 16, 6, 3, 17], [0, 10, 16, 2, 13, 17, 8, 9, 18, 3, 12, 6, 7, 4, 14, 15, 10]];
	const order = ORDERS[Math.floor(Math.random() * ORDERS.length)];
	const cubicInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);		// 对应 TweenStar 的 Cubic.easeInOut 缓动函数。
	// 画面的水平位置；各图层相机保持在舞台中心（Scaleform 相机不会随影片剪辑移动）。
	const slide = (s, x) => {
		s.el.style.transform = 'translateX(' + x + 'px)';
		for (const c of s.cams) c.style.perspectiveOrigin = (640 - x) + 'px 360px';
	};
	const place = (l, x, yr, xr) => { l.el.style.transform = 'translate3d(' + x + 'px,' + l.y + 'px,0) rotateY(' + -yr + 'deg) rotateX(' + -xr + 'deg)'; };
	// 画面图片在显示前完成解码（原动画也会等待其纹理字典就绪）。
	const prepare = (i) => {
		const layers = SCREENS[order[i]].map((d) => ({ ...d, img: Object.assign(new Image(), { src: '/b/8b0b5899ed/title/art/' + d.tex + '.webp' }) }));
		return Promise.all(layers.map((l) => l.img.decode().catch(() => {}))).then(() => layers);
	};
	let active = null, leaving = null, index = 0, alt = -1, timer = 0, raf = 0, stopped = false;
	const show = (defs) => {
		const now = performance.now();
		alt = alt <= 0 ? 1 : -1;		// updateScreenIndex：交替使用两侧。
		const el = document.createElement('div');
		el.className = 'ls-screen';
		const cams = [];
		const s = { el, slideFrom: alt * 1280, start: now, settled: 0, cams, layers: defs.map((d) => {
			const cam = document.createElement('div'), e = document.createElement('div');
			cam.className = 'ls-cam';
			e.className = 'ls-layer';
			e.style.width = d.w + 'px'; e.style.height = d.h + 'px';
			e.style.backgroundImage = 'url(' + d.img.src + ')';
			cam.appendChild(e);
			el.appendChild(cam);
			cams.push(cam);
			return { el: e, y: d.y, x0: d.x, yr0: d.yr, xr0: 0, x1: d.to.x ?? d.x, yr1: d.to.yr ?? d.yr, xr1: d.to.xr ?? 0 };
		}) };
		for (const l of s.layers) place(l, l.x0, l.yr0, l.xr0);
		slide(s, s.slideFrom);
		holder.appendChild(el);		// 放在正在退出的画面上方。
		if (leaving) leaving.el.remove();
		leaving = active;
		if (leaving) { leaving.slideFrom = 0; leaving.slideTo = -alt * 1280; leaving.start = now; }
		active = s;
		s.slideTo = 0;
	};
	const tick = (now) => {
		for (const s of [leaving, active]) {
			if (!s) continue;
			const p = Math.min(1, (now - s.start) / 850);
			if (p < 1 || !s.slid) { slide(s, s.slideFrom + (s.slideTo - s.slideFrom) * cubicInOut(p)); s.slid = p === 1; }
			if (s === active && p === 1 && !s.settled) s.settled = now;		// loadscreenIsSettled：各图层开始持续 42 秒的过渡动画。
			if (s.settled) {
				const q = Math.min(1, (now - s.settled) / 42000);
				for (const l of s.layers) place(l, l.x0 + (l.x1 - l.x0) * q, l.yr0 + (l.yr1 - l.yr0) * q, l.xr0 + (l.xr1 - l.xr0) * q);
			}
			if (s === leaving && p === 1) { s.el.remove(); leaving = null; }
		}
		if (!stopped) raf = requestAnimationFrame(tick);
	};
	let next = prepare(0);
	const cycle = () => next.then((defs) => {
		if (stopped) return;
		show(defs);
		index = (index + 1) % order.length;
		next = prepare(index);
		timer = setTimeout(cycle, 14000);		// timerDuration：画面切换周期。
	});
	timer = setTimeout(cycle, 500);
	raf = requestAnimationFrame(tick);
	stopTitle = () => { stopped = true; clearTimeout(timer); cancelAnimationFrame(raf); };

		shotRt: q.get('shotrt') === '1',		// ?shotrt=1（搭配 ?shot=N）：游戏世界显示后，将某一帧的全部渲染目标发送到开发服务器的 shots/（wgpu_worker.js）。
		noHints: q.get('nohints') === '1',		// ?nohints=1：不提前获取流式加载器排队的读取内容（io_worker.js 的 drainHints；用于诊断）。
		noPack: q.get('nopack') === '1',		// ?nopack=1：逐个获取着色器，不使用着色器包（wgpu_worker.js；用于诊断）。
		gpuLimits: q.get('limits') || '',		// ?limits=maxSampledTexturesPerShaderStage:16,...：请求低于适配器实际能力的 GPU 限制，用于重现较弱设备的限制（wgpu_worker.js）。
		keepThreads: (q.get('keep') || '').split(',').reduce((m, g) => m | ({ replay: 1, net: 2, bink: 4, idle: 8 }[g] || 0), 0),		// ?keep=replay,net,bink,idle：启动指定线程组（用于诊断）。
		cores,
		noStore: !!(q.get('nocache') || q.get('nosw')),
		fullConsole: !!q.get('console'),
		remoteLog,		// ?log=1（见上文）：loader.js 将此选项传给引擎线程、GPU 工作线程及 I/O 工作线程。
		trace: !!q.get('trace'),		// ?trace=1：记录引擎的每次文件请求（io_worker.js）。
		slots: +(q.get('slots') || 0),		// ?slots=N：设置 GPU 工作线程同时处理的帧数（用于诊断）。
		syncPipelines: !!q.get('syncpipelines'),		// ?syncpipelines=1：GPU 工作线程同步编译渲染管线，编译期间不跳过绘制调用。
		record: !!q.get('record'),		// ?record=1：记录启动时的读取集合（io_worker.js），供 record_bootset.py 使用。
		lowMemory,
	}, [offscreen]);
}

// ?mem=1（诊断选项，需搭配 ?log=1）：每隔 15 秒调用 performance.measureUserAgentSpecificMemory()（需要跨域隔离），并上传到开发服务器日志。
if (remoteLog && (q.get('mem') || lowMemory) && performance.measureUserAgentSpecificMemory) {		// 启用 ?log=1 后，低内存配置默认执行此监测，使日志保留崩溃或卡顿前的最后一次读数。
	const report = async () => {
		try {
			const r = await performance.measureUserAgentSpecificMemory();
			const rows = r.breakdown.filter((b) => b.bytes > 1e6).map((b) => (b.bytes / 1048576 | 0) + ' MB ' + (b.types || []).join('+') + ' ' + (b.attribution || []).map((a) => (a.url || '').split('/').pop() + '/' + (a.scope || '')).join(','));
			postLog('[page mem] total ' + (r.bytes / 1048576 | 0) + ' MB; ' + rows.join(' | '));
		} catch (e) { postLog('[page mem] failed: ' + e); }
		setTimeout(report, 15000);
	};
	setTimeout(report, 15000);
}

// ---- 音频：引擎混音器写入共享内存中的环形缓冲区（platform/audio/browser_audio_wasm.cpp），由 AudioWorklet 播放 -------------------
// 浏览器仅在用户交互后允许播放音频，因此在首次点击或按键时创建音频上下文。
let audioPending = null, audioGesture = false, audioStarted = false;
function tryStartAudio() {
	if (!audioPending || !audioGesture || audioStarted) return;
	audioStarted = true;
	(async () => {
		try {
			const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
			await ctx.audioWorklet.addModule(BASE + '/audio-worklet.js');
			const node = new AudioWorkletNode(ctx, 'game-audio', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: audioPending });
			node.connect(ctx.destination);
			await ctx.resume();
			addEventListener('pointerdown', () => ctx.resume());
			addEventListener('keydown', () => ctx.resume());
			if (q.get('mem')) {		// 诊断信息：每隔 5 秒记录环形缓冲区状态。
				const hdr = new Int32Array(audioPending.memory.buffer, audioPending.ring, 8);
				setInterval(() => postLog('[page audio] state ' + ctx.state + ', frames written ' + (hdr[0] >>> 0) + ', read ' + (hdr[1] >>> 0) + ', fill ' + (((hdr[0] - hdr[1]) >>> 0)) + ', worklet calls ' + (hdr[3] >>> 0) + ', peak ' + (Atomics.exchange(hdr, 4, 0) / 1e6).toFixed(3)), 5000);
			}
			postLog('[page] audio started: ' + ctx.sampleRate + ' Hz, base latency ' + ctx.baseLatency);
		} catch (e) { audioStarted = false; postLog('[page] audio failed: ' + e); }
	})();
}
for (const type of ['pointerdown', 'keydown']) addEventListener(type, () => { audioGesture = true; tryStartAudio(); }, { capture: true });

// ---- 输入：DOM 事件 -> 共享内存中的引擎输入块（platform/input/browser_input_wasm.cpp） ------------------------
// WasmInputBlock 布局：先是 256 个按键字节，然后是 int32 字段 mouseX、mouseY、dX、dY、dZ、buttons、focus、locked、textHead、textTail，最后是 text[64]（uint16）。
const VK = {
	Backspace: 0x08, Tab: 0x09, Enter: 0x0D, NumpadEnter: 0xFD, Pause: 0x13, CapsLock: 0x14, Escape: 0x1B, Space: 0x20, PageUp: 0x21, PageDown: 0x22,
	End: 0x23, Home: 0x24, ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28, PrintScreen: 0x2C, Insert: 0x2D, Delete: 0x2E,
	MetaLeft: 0x5B, MetaRight: 0x5C, ContextMenu: 0x5D, NumpadMultiply: 0x6A, NumpadAdd: 0x6B, NumpadSubtract: 0x6D, NumpadDecimal: 0x6E, NumpadDivide: 0x6F,
	NumLock: 0x90, ScrollLock: 0x91, ShiftLeft: 0xA0, ShiftRight: 0xA1, ControlLeft: 0xA2, ControlRight: 0xA3, AltLeft: 0xA4, AltRight: 0xA5,
	Semicolon: 0xBA, Equal: 0xBB, Comma: 0xBC, Minus: 0xBD, Period: 0xBE, Slash: 0xBF, Backquote: 0xC0, BracketLeft: 0xDB, Backslash: 0xDC, BracketRight: 0xDD,
	Quote: 0xDE, IntlBackslash: 0xE2,
};
for (let i = 0; i < 10; i++) { VK['Digit' + i] = 0x30 + i; VK['Numpad' + i] = 0x60 + i; }
for (let i = 0; i < 26; i++) VK['Key' + String.fromCharCode(65 + i)] = 0x41 + i;
for (let i = 1; i <= 24; i++) VK['F' + i] = 0x6F + i;

// ?dbg=1：通过限制绘制调用定位渲染异常。GPU 工作线程每帧仅执行前 N 次绘制（N 存于输入块，-1 表示全部），并
// 报告最后一次绘制所用的渲染管线。找到异常首次出现时最小的 N，即可定位产生异常的绘制调用。F1/F2：N -1/+1，F3/F4：N -25/+25；
// F5：恢复全部绘制；F6：将当前绘制信息写入服务器日志（诊断时发送该日志）。
function installDebugPanel(memory, block) {
	const dbg = new Int32Array(memory.buffer, block + 424, 2);
	const panel = document.createElement('div');
	panel.style.cssText = 'position:fixed;left:0;top:0;right:0;background:#000c;color:#8f8;font:12px Consolas,"Microsoft YaHei","PingFang SC",monospace;padding:4px 8px;z-index:9;white-space:pre-wrap;pointer-events:none';
	document.body.appendChild(panel);
	let last = '', total = 0;
	new BroadcastChannel('game-debug').onmessage = (ev) => { last = ev.data.last; total = ev.data.total; render(); };
	const render = () => { const n = Atomics.load(dbg, 0); panel.textContent = '绘制调试  上限：' + (n < 0 ? '关闭（全部）' : n) + ' / ' + total + ' 次绘制/帧   [F1 -1  F2 +1  F3 -25  F4 +25  F5 全部  F6 记录日志]\n最后执行的绘制：' + (last || '-'); };
	addEventListener('keydown', (e) => {
		const step = { F1: -1, F2: 1, F3: -25, F4: 25 }[e.code];
		if (step !== undefined) {
			const n = Atomics.load(dbg, 0);
			Atomics.store(dbg, 0, Math.max(0, Math.min(total, (n < 0 ? total : n) + step)));
			e.preventDefault(); render();
		} else if (e.code === 'F5' && !e.ctrlKey) { Atomics.store(dbg, 0, -1); e.preventDefault(); render(); }
		else if (e.code === 'F6') { postLog('[debug draw] limit ' + Atomics.load(dbg, 0) + ' of ' + total + ' | ' + last); e.preventDefault(); }
	}, { capture: true });
	render();
}

function installInput(memory, block) {
	if (q.get('dbg')) installDebugPanel(memory, block);
	const keys = new Uint8Array(memory.buffer, block, 256);
	const w = new Int32Array(memory.buffer, block + 256, 10);
	const U16 = new Uint16Array(memory.buffer, block + 256 + 40, 64);
	const MX = 0, MY = 1, DX = 2, DY = 3, DZ = 4, BTN = 5, FOCUS = 6, LOCKED = 7, HEAD = 8, TAIL = 9;
	let W = startSize[0], H = startSize[1];		// 后备缓冲区的设备像素尺寸（用于限制鼠标坐标），窗口改变大小时更新。
	const ext = new Int32Array(memory.buffer, block + 424, 4);		// 扩展字段：dbgDrawLimit、dbgFrameDraws、winW、winH。
	startModeWord = new Int32Array(memory.buffer, block + 440, 1);		// startMode：对应上方启动菜单。
	if (startMode) Atomics.store(startModeWord, 0, startMode);
	Atomics.store(ext, 2, W); Atomics.store(ext, 3, H);
	if (!q.get('fixed')) {
		let timer = 0;
		addEventListener('resize', () => {
			clearTimeout(timer);
			timer = setTimeout(() => {
				const [w, h] = wantSize();
				if (w === W && h === H) return;
				W = w; H = h;
				Atomics.store(ext, 2, w); Atomics.store(ext, 3, h);
				trace('window resized: back buffer ' + w + 'x' + h);
			}, 150);
		});
	}
	Atomics.store(w, FOCUS, document.hasFocus() ? 1 : 0);
	Atomics.store(w, MX, W >> 1);
	Atomics.store(w, MY, H >> 1);

	// 输入追踪：记录页面最先收到的事件及其流向（POST /log），便于判断键盘失效发生在哪个阶段。
	let traced = 0;
	const trace = (msg) => { if (traced < 80) { traced++; postLog('[page input] ' + msg); } };
	const passThrough = (e) => e.code === 'F12' || e.code === 'F11' || (e.ctrlKey && e.shiftKey && (e.code === 'KeyI' || e.code === 'KeyJ')) || e.code === 'F5';
	// 游戏中的飞机和潜艇使用小键盘控制俯仰与横滚（8/2/4/6，7/9 选择目标），但许多键盘没有小键盘。由于这些按键没有其他绑定，I/K（俯仰）、J/L（横滚）
	// 和 U/O（左/右目标）会向引擎发送对应的小键盘按键；实体小键盘仍可正常使用。
	const FLY_ALIAS = { KeyI: 'Numpad8', KeyK: 'Numpad2', KeyJ: 'Numpad4', KeyL: 'Numpad6', KeyU: 'Numpad7', KeyO: 'Numpad9' };
	const held = new Set();
	const syncFlyAlias = () => { for (const [src, target] of Object.entries(FLY_ALIAS)) Atomics.store(keys, VK[target], held.has(src) || held.has(target) ? 0x80 : 0); };
addEventListener('keydown', (e) => {
		if (editingInput(e)) return;
		if (stopOnlineDebugKey(e)) return;
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (!e.repeat) trace('keydown ' + e.code + ' vk=' + (vk || 'UNMAPPED') + ' hasFocus=' + document.hasFocus() + ' engineFocus=' + Atomics.load(w, FOCUS));
		if (vk) Atomics.store(keys, vk, 0x80);
		held.add(e.code); syncFlyAlias();
		if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.key.charCodeAt(0); Atomics.store(w, HEAD, (head + 1) | 0); }
		} else if (e.code === 'Backspace' || e.code === 'Enter') {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.code === 'Enter' ? 13 : 8; Atomics.store(w, HEAD, (head + 1) | 0); }
		}
	});
addEventListener('keyup', (e) => {
		if (editingInput(e)) return;
		if (stopOnlineDebugKey(e)) return;
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (vk) Atomics.store(keys, vk, 0);
		held.delete(e.code); syncFlyAlias();
	});
	const releaseAll = () => { held.clear(); for (let i = 0; i < 256; i++) Atomics.store(keys, i, 0); Atomics.store(w, BTN, 0); };
	addEventListener('online-modal-open', releaseAll);
	addEventListener('focus', () => { trace('window focus'); Atomics.store(w, FOCUS, 1); });
	addEventListener('blur', () => { trace('window blur (all keys released)'); Atomics.store(w, FOCUS, 0); releaseAll(); });

	const locked = () => document.pointerLockElement === canvas;
	canvas.addEventListener('mousedown', (e) => {
		if (!locked()) { canvas.requestPointerLock({ unadjustedMovement: true }).catch(() => canvas.requestPointerLock()); }
		Atomics.or(w, BTN, 1 << [0, 2, 1, 3, 4][e.button]);
		e.preventDefault();
	});
	addEventListener('mouseup', (e) => { Atomics.and(w, BTN, ~(1 << [0, 2, 1, 3, 4][e.button])); });
	addEventListener('contextmenu', (e) => { if (!editingInput(e)) e.preventDefault(); });
	document.addEventListener('pointerlockchange', () => { trace('pointer lock ' + (locked() ? 'on' : 'off')); Atomics.store(w, LOCKED, locked() ? 1 : 0); });
	addEventListener('mousemove', (e) => {
		const r = canvas.getBoundingClientRect();
		if (locked()) {
			Atomics.add(w, DX, e.movementX);
			Atomics.add(w, DY, e.movementY);
			const x = Math.max(0, Math.min(W - 1, Atomics.load(w, MX) + e.movementX));
			const y = Math.max(0, Math.min(H - 1, Atomics.load(w, MY) + e.movementY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		} else {
			const x = Math.max(0, Math.min(W - 1, Math.round((e.clientX - r.left) * W / r.width)));
			const y = Math.max(0, Math.min(H - 1, Math.round((e.clientY - r.top) * H / r.height)));
			Atomics.add(w, DX, x - Atomics.load(w, MX));
			Atomics.add(w, DY, y - Atomics.load(w, MY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		}
	});
	// 根据实际滚动距离换算滚轮刻度：Windows 上 Chrome 在像素模式下每刻度约报告 100 px，行模式下为 3 行；触控板和平滑滚动产生的
	// 小数会累积。引擎每帧消耗一个刻度（browser_input_wasm.cpp），因此较长的滚动会持续数帧。
	let wheelAccum = 0;
	addEventListener('wheel', (e) => {
		if (editingInput(e)) return;
		e.preventDefault();
		wheelAccum += -e.deltaY / (e.deltaMode === 0 ? 100 : e.deltaMode === 1 ? 3 : 1);
		const n = Math.trunc(wheelAccum);
		if (n) { wheelAccum -= n; Atomics.add(w, DZ, n); }
	}, { passive: false });
}
</script>
</body>
