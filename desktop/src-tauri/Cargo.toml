[package]
name = "gta5data-launcher"
version = "0.2.3"
description = "只读挂载玩家资源的 GTA V 浏览器启动器"
edition = "2021"
rust-version = "1.85"
default-run = "gta5data-launcher"

[lib]
name = "gta5data_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md5 = "0.7"
tiny_http = "0.12"
flate2 = "1"
url = "2"
percent-encoding = "2"
include_dir = "0.7"
rfd = "0.16"
open = "5"
aes = "0.8"
cipher = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
