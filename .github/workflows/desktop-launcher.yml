name: 构建桌面启动器
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: 构建 ${{ matrix.platform }} 启动器
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows 64 位
            artifact: GTA5Data-Launcher-Windows-x64
            binary: desktop/src-tauri/target/release/gta5data-launcher.exe
          - os: macos-14
            platform: macOS 苹果芯片
            artifact: GTA5Data-Launcher-macOS-arm64-Development
            binary: desktop/src-tauri/target/release/bundle/macos/GTA5Data Launcher.app
    runs-on: ${{ matrix.os }}
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
      - name: 准备 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 准备 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 安装启动器依赖
        run: npm ci
        working-directory: desktop
      - name: 检查启动器界面交互
        run: npm test
        working-directory: desktop
      - name: 编译 Windows 便携客户端
        if: runner.os == 'Windows'
        run: npm run tauri -- build --no-bundle
        working-directory: desktop
      - name: 编译 macOS 应用
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app
        working-directory: desktop
      - name: 验证 macOS 开发签名（未公证）
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 '${{ matrix.binary }}'
      - name: 打包 macOS 应用
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent '${{ matrix.binary }}' desktop/GTA5Data-Launcher-macOS-arm64-Development.zip
      - name: 保存 Windows 构建产物
        uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      - name: 保存 macOS 构建产物
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: desktop/GTA5Data-Launcher-macOS-arm64-Development.zip
          if-no-files-found: error
