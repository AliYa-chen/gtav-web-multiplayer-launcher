name: Build and release launcher and server / 构建并分类发布启动器与服务端

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_ssh:
        description: 'Only verify US encrypted SSH credentials / 仅检查美国加密 SSH 凭据'
        type: boolean
        default: false
        required: false
      retry_server_run_id:
        description: 'Retry US deployment from an original build run / 使用原构建任务重试美国部署'
        type: string
        default: ''
        required: false

# Release tags are immutable. Queue merges instead of interrupting uploads.
concurrency:
  group: component-releases-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  plan:
    name: Validate versions, bilingual notes and source provenance / 检查版本、双语更新说明和源码来源
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      launcher: ${{ steps.plan.outputs.launcher }}
      launcher_version: ${{ steps.plan.outputs.launcher_version }}
      server: ${{ steps.plan.outputs.server }}
      server_version: ${{ steps.plan.outputs.server_version }}
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository content boundaries / 检查仓库提交边界
        run: python -B tools/check_git_contents.py
      - name: Install pinned SSH transport for diagnosis / 为诊断安装固定版本 SSH 通信库
        if: github.event_name == 'workflow_dispatch' && inputs.check_ssh == true
        run: python -m pip install 'paramiko==4.0.0'
      - name: Verify US encrypted SSH credentials / 仅校验美国加密 SSH 凭据
        if: github.event_name == 'workflow_dispatch' && inputs.check_ssh == true
        env:
          GTA_US_SSH_HOST: ${{ secrets.GTA_US_SSH_HOST }}
          GTA_US_SSH_PORT: ${{ secrets.GTA_US_SSH_PORT }}
          GTA_US_SSH_USER: ${{ secrets.GTA_US_SSH_USER }}
          GTA_US_SSH_PASSWORD: ${{ secrets.GTA_US_SSH_PASSWORD }}
          GTA_SSH_KNOWN_HOSTS: ${{ secrets.GTA_SSH_KNOWN_HOSTS }}
        run: python -B tools/deploy_server.py --check-ssh --regions us
      - name: Select components from versions and update MD / 根据版本与更新 MD 选择待发布组件
        if: inputs.check_ssh != true && inputs.retry_server_run_id == ''
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/prepare_release.py plan
          --output archive/release-plan/release-plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Save verified artifact / 保存核验后的附件
        if: inputs.check_ssh != true && inputs.retry_server_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan/release-plan.json
          if-no-files-found: error

  build-windows:
    name: Build launcher / 构建启动器 · Windows x64
    needs: plan
    if: needs.plan.outputs.launcher == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan
      - name: Set up Node.js / 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Set up Rust targets / 准备 Rust 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Restore Rust cache / 恢复 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-windows-x64
      - name: Install launcher dependencies / 安装启动器依赖
        run: npm ci
        working-directory: desktop
      - name: Compile portable Windows launcher / 编译 Windows 便携启动器
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle
        working-directory: desktop
      - name: Verify x64 executable and embedded version / 核对真实 x64 程序与内嵌版本
        run: >-
          python -B tools/check_release_assets.py windows
          --plan archive/release-plan/release-plan.json
          --input desktop/src-tauri/target/x86_64-pc-windows-msvc/release/gta5data-launcher.exe
          --output-directory archive/release-launcher-windows
      - name: Save verified artifact / 保存核验后的附件
        uses: actions/upload-artifact@v4
        with:
          name: build-launcher-windows
          path: archive/release-launcher-windows/*
          if-no-files-found: error

  build-macos:
    name: Build launcher / 构建启动器 · macOS ARM64 开发版
    needs: plan
    if: needs.plan.outputs.launcher == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan
      - name: Set up Node.js / 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Set up Rust targets / 准备 Rust 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Restore Rust cache / 恢复 Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-macos-arm64
      - name: Install launcher dependencies / 安装启动器依赖
        run: npm ci
        working-directory: desktop
      - name: Compile ARM64 macOS app / 按明确目标编译 macOS ARM64 应用
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app
        working-directory: desktop
      - name: Verify ARM64, version, signature and ZIP / 核验 ARM64、应用版本、严格签名与压缩包
        run: >-
          python -B tools/check_release_assets.py macos
          --plan archive/release-plan/release-plan.json
          --input 'desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/GTA5Data Launcher.app'
          --output-directory archive/release-launcher-macos
      - name: Save verified artifact / 保存核验后的附件
        uses: actions/upload-artifact@v4
        with:
          name: build-launcher-macos
          path: archive/release-launcher-macos/*
          if-no-files-found: error

  build-server:
    name: Build server / 构建服务端 · Java 17 JAR 与部署包
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java / 准备 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan
      - name: Compile resource-independent server / 编译不依赖游戏资源的服务端
        run: python -B tools/build_multiplayer_server.py --output archive/server-build/multiplayer-server.jar
      - name: Verify Java/runtime and package server / 核验 Java 与运行版本并打包服务端
        run: >-
          python -B tools/check_release_assets.py server
          --plan archive/release-plan/release-plan.json
          --input archive/server-build/multiplayer-server.jar
          --output-directory archive/release-server
      - name: Record provenance and checksums / 记录精确源码来源与完整校验文件
        run: >-
          python -B tools/check_release_assets.py metadata
          --plan archive/release-plan/release-plan.json
          --component server --output-directory archive/release-server
      - name: Save verified artifact / 保存核验后的附件
        uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: archive/release-server/*
          if-no-files-found: error

  publish-launcher:
    name: Publish launcher / 发布启动器 · English then 简体中文
    needs: [plan, build-windows, build-macos]
    if: needs.plan.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          pattern: build-launcher-*
          path: archive/release-launcher
          merge-multiple: true
      - name: Verify both platforms and record SHA-256 / 核验两个平台并记录源码与 SHA-256
        run: >-
          python -B tools/check_release_assets.py metadata
          --plan archive/release-plan/release-plan.json
          --component launcher --output-directory archive/release-launcher
      - name: Publish verified launcher assets / 上传草稿、校验 GitHub 摘要并发布启动器
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/prepare_release.py publish
          --plan archive/release-plan/release-plan.json
          --component launcher --assets-directory archive/release-launcher

  publish-server:
    name: Publish server / 发布服务端 · English then 简体中文
    needs: [plan, build-server]
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-server
          path: archive/release-server
      - name: Verify server assets and version / 核验独立版本的服务端附件
        run: >-
          python -B tools/check_release_assets.py verify
          --plan archive/release-plan/release-plan.json
          --component server --output-directory archive/release-server
      - name: Publish verified server assets / 上传草稿、校验 GitHub 摘要并发布服务端
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/prepare_release.py publish
          --plan archive/release-plan/release-plan.json
          --component server --assets-directory archive/release-server

  deploy-server:
    name: Deploy US server / 部署美国服务端 · 实验线路先于正式线路
    needs: [plan, publish-server]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
      inputs.check_ssh != true &&
      ((needs.plan.outputs.server == 'true' && needs.publish-server.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.retry_server_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    steps:
      - name: Check out source / 拉取源码
        uses: actions/checkout@v4
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js / 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Java / 准备 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: archive/release-plan
          run-id: ${{ inputs.retry_server_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download build artifact / 下载构建附件
        uses: actions/download-artifact@v4
        with:
          name: release-server
          path: archive/release-server
          run-id: ${{ inputs.retry_server_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify original published deployment assets / 核验原构建与已发布附件
        if: inputs.retry_server_run_id != ''
        id: retry
        env:
          GH_TOKEN: ${{ github.token }}
          GTA_RETRY_RUN_ID: ${{ inputs.retry_server_run_id }}
        run: >-
          python -B tools/prepare_deployment_retry.py
          --run-id "$GTA_RETRY_RUN_ID"
          --plan archive/release-plan/release-plan.json
          --assets-directory archive/release-server
          --github-output "$GITHUB_OUTPUT"
      - name: Check out original build commit / 拉取原附件对应的构建提交
        if: inputs.retry_server_run_id != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.retry.outputs.source_commit }}
          path: archive/retry-source
      - name: Apply current deployment checks to original source / 将当前部署检查用于原构建源码
        if: inputs.retry_server_run_id != ''
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from readonly_game_outputs import atomic_write_bytes
          for name in ('deploy_server.py', 'server_protocol_check.mjs'):
              source = Path('tools') / name
              target = Path('archive/retry-source/tools') / name
              atomic_write_bytes(target, source.read_bytes(), sources=(source,))
          PY
      - name: Install pinned SSH transport / 安装固定版本 SSH 通信库
        run: python -m pip install 'paramiko==4.0.0'
      - name: Deploy verified JARs / 部署已核验 JAR 并保留世界数据与生产证书
        env:
          GTA_US_SSH_HOST: ${{ secrets.GTA_US_SSH_HOST }}
          GTA_US_SSH_PORT: ${{ secrets.GTA_US_SSH_PORT }}
          GTA_US_SSH_USER: ${{ secrets.GTA_US_SSH_USER }}
          GTA_US_SSH_PASSWORD: ${{ secrets.GTA_US_SSH_PASSWORD }}
          GTA_SSH_KNOWN_HOSTS: ${{ secrets.GTA_SSH_KNOWN_HOSTS }}
          GTA_SERVER_BASE: ${{ vars.GTA_SERVER_BASE }}
          GTA_US_PUBLIC_DOMAIN: ${{ vars.GTA_US_PUBLIC_DOMAIN }}
          GTA_DEPLOYMENT_SOURCE: ${{ inputs.retry_server_run_id && format('{0}/archive/retry-source', github.workspace) || github.workspace }}
        run: |
          python -B - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['GTA_DEPLOYMENT_SOURCE'])
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          subprocess.run([sys.executable, '-B', str(root / 'tools/deploy_server.py'),
              '--regions', 'us', '--plan', str(workspace / 'archive/release-plan/release-plan.json'),
              '--assets-directory', str(workspace / 'archive/release-server'),
              '--report', str(workspace / 'archive/deployment/server-deployment.json')], cwd=root, check=True)
          PY
      - name: Preserve deployment/rollback audit / 保存部署与回滚记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-deployment-audit
          path: archive/deployment/server-deployment.json
          if-no-files-found: warn

  deploy-launcher:
    name: Deploy launcher downloads and configuration / 部署启动器下载与配置
    needs: [plan, publish-launcher]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
      inputs.check_ssh != true && inputs.retry_server_run_id == '' &&
      ((needs.plan.outputs.launcher == 'true' && needs.publish-launcher.result == 'success') ||
      needs.plan.outputs.launcher == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out source and release provenance / 拉取源码与历史发布来源
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python / 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare published packages and generated PHP / 核验已发布安装包并生成 PHP 配置
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/prepare_launcher_deployment.py
          --assets-directory archive/launcher-deployment/assets
          --config-output archive/launcher-deployment/index.php
          --metadata-output archive/launcher-deployment/deployment.json
      - name: Install pinned SSH transport / 安装固定版本 SSH 通信库
        run: python -m pip install 'paramiko==4.0.0'
      - name: Fetch packages, activate PHP and retire old packages / 拉取新包、启用配置并清理旧包
        env:
          GTA_OSS_SSH_HOST: ${{ secrets.GTA_OSS_SSH_HOST }}
          GTA_OSS_SSH_PORT: ${{ secrets.GTA_OSS_SSH_PORT }}
          GTA_OSS_SSH_USER: ${{ secrets.GTA_OSS_SSH_USER }}
          GTA_OSS_SSH_PASSWORD: ${{ secrets.GTA_OSS_SSH_PASSWORD }}
          GTA_OSS_SSH_KNOWN_HOSTS: ${{ secrets.GTA_OSS_SSH_KNOWN_HOSTS }}
          GTA_OSS_SITE_ROOT: /opt/1panel/www/sites/oss.2t.hk/index/gtav
          GTA_OSS_PUBLIC_ORIGIN: https://oss.2t.hk/gtav
          GTA_OSS_PHP_CONTAINER: PHP85
          GTA_OSS_DOWNLOAD_MIRRORS: '["https://gh-proxy.com/", "https://ghfast.top/", "https://gh-proxy.org/"]'
        run: >-
          python -B tools/deploy_launcher.py
          --assets-directory archive/launcher-deployment/assets
          --config archive/launcher-deployment/index.php
          --metadata archive/launcher-deployment/deployment.json
          --report archive/deployment/launcher-deployment.json
      - name: Preserve launcher deployment and rollback audit / 保存启动器部署与回滚记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-deployment-audit
          path: archive/deployment/launcher-deployment.json
          if-no-files-found: warn
