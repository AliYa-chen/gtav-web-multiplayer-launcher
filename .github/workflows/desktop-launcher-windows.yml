name: 构建 Windows 启动器

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows x64
    runs-on: windows-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
      - name: 准备 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 准备 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 安装启动器依赖
        run: npm ci
        working-directory: desktop
      - name: 编译 Windows 便携客户端
        run: npm run tauri -- build --no-bundle
        working-directory: desktop
      - name: 保存 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GTA5Data-Launcher-Windows-x64-v0.2.16
          path: desktop/src-tauri/target/release/gta5data-launcher.exe
          if-no-files-found: error
