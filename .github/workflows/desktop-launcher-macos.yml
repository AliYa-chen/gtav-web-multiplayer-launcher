name: 构建 macOS 启动器

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: 构建 macOS Apple Silicon
    runs-on: macos-14
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
      - name: 准备 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 准备 Rust 编译环境
        uses: dtolnay/rust-toolchain@stable
      - name: 恢复 Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 安装启动器依赖
        run: npm ci
        working-directory: desktop
      - name: 编译 macOS 应用
        run: npm run tauri -- build --bundles app
        working-directory: desktop
      - name: 验证 macOS 开发签名（未公证）
        run: codesign --verify --deep --strict --verbose=2 'desktop/src-tauri/target/release/bundle/macos/GTA5Data Launcher.app'
      - name: 打包 macOS 应用
        run: ditto -c -k --sequesterRsrc --keepParent 'desktop/src-tauri/target/release/bundle/macos/GTA5Data Launcher.app' desktop/GTA5Data-Launcher-macOS-arm64-v0.2.12-development.zip
      - name: 保存 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GTA5Data-Launcher-macOS-arm64-v0.2.12-development
          path: desktop/GTA5Data-Launcher-macOS-arm64-v0.2.12-development.zip
          if-no-files-found: error
